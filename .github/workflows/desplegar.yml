name: Comprobar y desplegar

on:
  push:
    branches: [claude/fishing-app-sevilla-mdhbzr]
  pull_request:
  # Para lanzarlo a mano desde la pestaña Actions sin tener que subir nada.
  workflow_dispatch:

concurrency:
  group: desplegar
  # Nunca se cancela un despliegue a medias: dejaría el servidor reconstruyendo
  # y sin nadie mirando. Si llegan dos seguidos, el segundo espera.
  cancel-in-progress: false

jobs:
  comprobar:
    name: Comprobar
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # `npm ci` y no `npm install`: instala exactamente lo que dice el
      # lockfile. El postinstall ya ejecuta `prisma generate`.
      - run: npm ci --no-audit --no-fund

      - run: npm run typecheck
      - run: npm run lint

      # El build no toca la base de datos —todas las páginas son dinámicas—
      # pero el CLI de Prisma exige que la variable exista. Que esto pase sin
      # fichero de base de datos delante es justo lo que se quiere comprobar:
      # es el fallo que tumbó el build de Docker en el servidor.
      - run: npm run build
        env:
          DATABASE_URL: file:./prisma/dev.db

  desplegar:
    name: Desplegar
    needs: comprobar
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Comprobar que está configurado
        id: config
        env:
          CLAVE: ${{ secrets.SSH_CLAVE_PRIVADA }}
          SERVIDOR: ${{ secrets.SSH_SERVIDOR }}
          USUARIO: ${{ secrets.SSH_USUARIO }}
          HOST_KEY: ${{ secrets.SSH_HOST_KEY }}
        run: |
          if [ -z "$CLAVE" ] || [ -z "$SERVIDOR" ] || [ -z "$USUARIO" ] || [ -z "$HOST_KEY" ]; then
            echo "listo=no" >> "$GITHUB_OUTPUT"
            {
              echo "### Despliegue automático sin configurar"
              echo
              echo "Faltan secretos del repositorio. Mientras falten, esto no"
              echo "hace nada y **no es un error**. Las instrucciones están en"
              echo '`DESPLIEGUE.md`, apartado «Despliegue automático».'
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "listo=si" >> "$GITHUB_OUTPUT"

            # GitHub enmascara los secretos en el registro, así que si uno tiene
            # un espacio pegado o un dígito cambiado no hay forma de verlo: el
            # despliegue se limita a agotar el tiempo de espera dos minutos
            # después. Esto describe el valor sin revelarlo, que es justo lo que
            # hace falta para distinguir «el servidor no contesta» de «el
            # secreto está mal escrito».
            echo "SSH_SERVIDOR: ${#SERVIDOR} caracteres"
            case "$SERVIDOR" in
              *[!0-9a-zA-Z.:-]*)
                echo "  ATENCIÓN: contiene espacios, saltos de línea u otros"
                echo "  caracteres que no valen en una dirección. Vuelve a"
                echo "  crear el secreto escribiéndolo a mano." ;;
              *) echo "  formato correcto" ;;
            esac
            echo "SSH_USUARIO: ${#USUARIO} caracteres"
          fi

      - name: Preparar el acceso SSH
        if: steps.config.outputs.listo == 'si'
        env:
          CLAVE: ${{ secrets.SSH_CLAVE_PRIVADA }}
          HOST_KEY: ${{ secrets.SSH_HOST_KEY }}
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh

          # La llave se acepta de dos formas. Copiar un bloque de varias líneas
          # de una terminal a un formulario web sale mal a menudo —se pierden
          # saltos, se cuela sangría— y el error que da OpenSSH entonces es
          # «error in libcrypto», que no dice nada. En base64 es una sola línea
          # y no hay nada que estropear.
          case "$CLAVE" in
            -----BEGIN*) printf '%s\n' "$CLAVE" > ~/.ssh/clave ;;
            *)           printf '%s' "$CLAVE" | tr -d ' \n' | base64 -d > ~/.ssh/clave ;;
          esac
          chmod 600 ~/.ssh/clave

          # Que la llave se pueda leer se comprueba aquí, no cuando falle la
          # conexión: así el error dice qué secreto hay que rehacer.
          if ! ssh-keygen -y -f ~/.ssh/clave > /dev/null 2>&1; then
            echo "::error::El secreto SSH_CLAVE_PRIVADA no es una llave válida."
            echo "En el servidor, genera la versión de una sola línea con:"
            echo "    base64 -w0 /home/despliegue/.ssh/github"
            echo "y pega ESA línea en el secreto."
            exit 1
          fi

          # La huella del servidor va fijada. Sin esto habría que aceptar
          # cualquier host que conteste, que es exactamente por donde entra un
          # ataque de intermediario.
          printf '%s\n' "$HOST_KEY" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Desplegar
        if: steps.config.outputs.listo == 'si'
        env:
          SERVIDOR: ${{ secrets.SSH_SERVIDOR }}
          USUARIO: ${{ secrets.SSH_USUARIO }}
          DIRECTORIO: ${{ vars.DIRECTORIO_PESCA }}
        run: |
          # Sin ConnectTimeout, una dirección equivocada tarda dos minutos en
          # rendirse y el registro no dice nada útil mientras tanto.
          SSH=(ssh -o IdentitiesOnly=yes
                   -o StrictHostKeyChecking=yes
                   -o ConnectTimeout=15
                   -i ~/.ssh/clave
                   "$USUARIO@$SERVIDOR")

          # El script se copia y se ejecuta desde un fichero, en dos pasos.
          #
          # Con `bash -s` leyéndolo de la entrada estándar parecía más limpio,
          # pero dentro se llama a `docker compose exec -T`, que también lee de
          # ahí: se tragaba el resto del script y el despliegue terminaba en
          # silencio a mitad, con código de salida 0. Costaba verlo porque
          # salía en verde.
          #
          # Se copia en cada despliegue, así que el servidor ejecuta siempre la
          # versión de esta rama y no una que quedara ahí hace meses.
          "${SSH[@]}" "cat > /tmp/desplegar-pesca.sh" < docker/desplegar.sh

          "${SSH[@]}" -n "
            DIRECTORIO_PESCA='${DIRECTORIO:-}' \
            RAMA_PESCA='${{ github.ref_name }}' \
            bash /tmp/desplegar-pesca.sh
            salida=\$?
            rm -f /tmp/desplegar-pesca.sh
            exit \$salida
          "

      - name: Borrar la clave
        if: always()
        run: rm -f ~/.ssh/clave
